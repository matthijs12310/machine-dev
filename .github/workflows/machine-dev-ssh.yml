name: machine.dev SSH shell

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: "How long to keep the runner alive"
        required: true
        default: "350"
      auto_start_gaming:
        description: "Automatically start the selected gaming stack"
        required: true
        default: "true"
      gaming_stack:
        description: "Which gaming stack to start: sunshine, wolf, steam-headless, or none"
        required: true
        type: choice
        default: "steam-headless"
        options:
          - none
          - wolf
          - sunshine
          - steam-headless
      tailscale_exit_node:
        description: "Optional Tailscale exit node for game traffic, e.g. matt-game or moonlight-aws-relay"
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  ssh:
    runs-on:
      - machine
      - gpu=l4
      - cpu=16
      - regions=eu-south-2
      - tenancy=spot
      - disk_size=300
    timeout-minutes: 360

    steps:
      - name: Checkout machine-dev
        uses: actions/checkout@v4
        with:
          path: machine-dev

      - name: Restore Tailscale state cache
        uses: actions/cache/restore@v4
        with:
          path: .tailscale-cache
          key: tailscale-machine-dev-l4-eu-v1-${{ github.run_id }}
          restore-keys: |
            tailscale-machine-dev-l4-eu-v1-

      - name: Install and connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TAILSCALE_VERSION: "1.90.6"
        run: |
          set -euo pipefail

          install_tailscale_static() {
            local arch
            local tmpdir

            case "$(uname -m)" in
              x86_64|amd64) arch="amd64" ;;
              aarch64|arm64) arch="arm64" ;;
              armv7l) arch="arm" ;;
              *)
                echo "Unsupported Tailscale architecture: $(uname -m)"
                exit 1
                ;;
            esac

            if ! command -v curl >/dev/null 2>&1 || ! command -v tar >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends curl tar ca-certificates
            fi

            tmpdir="$(mktemp -d)"

            curl -fsSL --retry 3 --retry-delay 2 \
              -o "${tmpdir}/tailscale.tgz" \
              "https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE_VERSION}_${arch}.tgz"

            tar -xzf "${tmpdir}/tailscale.tgz" -C "${tmpdir}"

            sudo install -m 0755 \
              "${tmpdir}/tailscale_${TAILSCALE_VERSION}_${arch}/tailscale" \
              /usr/local/bin/tailscale

            sudo install -m 0755 \
              "${tmpdir}/tailscale_${TAILSCALE_VERSION}_${arch}/tailscaled" \
              /usr/local/bin/tailscaled

            rm -rf "${tmpdir}"
          }

          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "Missing TAILSCALE_AUTHKEY secret."
            echo ""
            echo "Create a Tailscale auth key with:"
            echo "  Reusable: yes"
            echo "  Ephemeral: no"
            echo "  Preauthorized: yes"
            echo "  Tags: tag:ci"
            exit 1
          fi

          install_tailscale_static

          mkdir -p "$GITHUB_WORKSPACE/.tailscale-state"

          if [ -f "$GITHUB_WORKSPACE/.tailscale-cache/tailscaled.state" ]; then
            echo "Restoring cached Tailscale state"
            sudo cp "$GITHUB_WORKSPACE/.tailscale-cache/tailscaled.state" \
              "$GITHUB_WORKSPACE/.tailscale-state/tailscaled.state"
          else
            echo "No cached Tailscale state found; first run will authenticate with auth key"
          fi

          sudo tailscaled \
            --state="$GITHUB_WORKSPACE/.tailscale-state/tailscaled.state" \
            >/tmp/tailscaled.log 2>&1 &

          sleep 3

          if sudo tailscale status >/dev/null 2>&1; then
            echo "Tailscale already authenticated from restored state"
            sudo tailscale up \
              --hostname=machine-dev-l4-eu \
              --advertise-tags=tag:ci \
              --ssh=false \
              --accept-routes
          else
            echo "No valid Tailscale state; authenticating with auth key"
            sudo tailscale up \
              --authkey="${TAILSCALE_AUTHKEY}" \
              --hostname=machine-dev-l4-eu \
              --advertise-tags=tag:ci \
              --ssh=false \
              --accept-routes
          fi

          echo ""
          echo "Tailscale status:"
          tailscale status || true

          echo ""
          echo "Tailscale IP:"
          tailscale ip -4 || true

      - name: Snapshot Tailscale state for cache
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/.tailscale-cache"

          if [ ! -f "$GITHUB_WORKSPACE/.tailscale-state/tailscaled.state" ]; then
            echo "Missing Tailscale state file; cannot snapshot"
            ls -la "$GITHUB_WORKSPACE/.tailscale-state" || true
            exit 1
          fi

          sudo cp "$GITHUB_WORKSPACE/.tailscale-state/tailscaled.state" \
            "$GITHUB_WORKSPACE/.tailscale-cache/tailscaled.state"

          sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE/.tailscale-cache"
          chmod -R u+rwX "$GITHUB_WORKSPACE/.tailscale-cache"

          echo "Snapshot state:"
          ls -la "$GITHUB_WORKSPACE/.tailscale-cache"

      - name: Save Tailscale state cache
        uses: actions/cache/save@v4
        with:
          path: .tailscale-cache
          key: tailscale-machine-dev-l4-eu-v1-${{ github.run_id }}

      - name: Preinstall Steam Headless host packages
        if: ${{ github.event.inputs.auto_start_gaming != 'false' && github.event.inputs.gaming_stack == 'steam-headless' }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 \
            pulseaudio-utils \
            vulkan-tools \
            x11-utils \
            x11-xserver-utils \
            xinput \
            xinit \
            xserver-xorg-core \
            xserver-xorg-input-evdev \
            xserver-xorg-input-libinput

      - name: Setup SSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          sudo apt-get install -y --no-install-recommends openssh-server

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "${SSH_PUBLIC_KEY}" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          sudo mkdir -p /root/.ssh
          sudo chmod 700 /root/.ssh
          printf '%s\n' "${SSH_PUBLIC_KEY}" | sudo tee /root/.ssh/authorized_keys >/dev/null
          sudo chmod 600 /root/.ssh/authorized_keys

          sudo sed -i \
            -e 's/^#\?PubkeyAuthentication .*/PubkeyAuthentication yes/' \
            -e 's/^#\?PasswordAuthentication .*/PasswordAuthentication no/' \
            -e 's/^#\?PermitRootLogin .*/PermitRootLogin prohibit-password/' \
            /etc/ssh/sshd_config

          sudo mkdir -p /run/sshd
          sudo systemctl restart ssh || sudo /usr/sbin/sshd

      - name: Install scripts and restore Sunshine pairing state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEAM_SESSION_ASSET_ID: "423715286"
        run: |
          set -euo pipefail

          sudo rm -rf /root/machine-dev
          sudo mkdir -p /root/machine-dev
          sudo cp -a machine-dev/. /root/machine-dev/
          echo "Repo available at /root/machine-dev"

          sudo chmod 755 /root/machine-dev
          sudo bash -c 'chmod +x /root/machine-dev/*.sh'
          sudo bash -c 'chmod +x /root/machine-dev/*.py'

          sudo mkdir -p /root/.config/sunshine/credentials

          sudo cp /root/machine-dev/sunshine/sunshine_state.json \
            /root/.config/sunshine/sunshine_state.json

          sudo cp /root/machine-dev/sunshine/cacert.pem \
            /root/.config/sunshine/credentials/cacert.pem

          sudo cp /root/machine-dev/sunshine/cakey.pem \
            /root/.config/sunshine/credentials/cakey.pem

          sudo chmod 600 /root/.config/sunshine/credentials/cakey.pem
          echo "Sunshine pairing state restored"

          if [ -d /root/machine-dev/wolf/cfg ]; then
            sudo mkdir -p /etc/wolf/cfg
            sudo cp -a /root/machine-dev/wolf/cfg/. /etc/wolf/cfg/
            sudo chmod 600 /etc/wolf/cfg/key.pem 2>/dev/null || true
            echo "Wolf pairing/config state restored"
          else
            echo "No Wolf pairing/config state found in repo, Wolf will generate one"
          fi

      - name: Start gaming stack
        if: ${{ github.event.inputs.auto_start_gaming != 'false' }}
        env:
          GAMING_STACK: ${{ github.event.inputs.gaming_stack }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FRP_RELAY_HOST: ${{ secrets.FRP_RELAY_HOST }}
          FRP_RELAY_PORT: ${{ secrets.FRP_RELAY_PORT }}
          FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
          TAILSCALE_EXIT_NODE: ${{ github.event.inputs.tailscale_exit_node }}
        run: |
          set -euo pipefail

          sudo mkdir -p /tmp/machine-dev-gaming

          case "${GAMING_STACK:-none}" in
            sunshine|wolf|steam-headless|none)
              ;;
            *)
              echo "Unknown gaming_stack: ${GAMING_STACK}"
              echo "Use: sunshine, wolf, steam-headless, or none"
              exit 1
              ;;
          esac

          if [ "${GAMING_STACK:-none}" = "none" ]; then
            echo "Gaming stack autostart disabled by gaming_stack=none"
            exit 0
          fi

          echo "Starting Machine.dev ${GAMING_STACK:-none} stack automatically"

          steam_headless_image="ghcr.io/${GITHUB_REPOSITORY}/steam-headless-machine-dev:latest"
          steam_headless_image="$(printf '%s' "$steam_headless_image" | tr '[:upper:]' '[:lower:]')"

          if [ "${GAMING_STACK:-none}" = "steam-headless" ]; then
            echo "${GITHUB_TOKEN}" | sudo docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            if sudo docker pull "${steam_headless_image}"; then
              echo "Using Steam Headless image: ${steam_headless_image}"
            else
              echo "Custom Steam Headless image is not available yet; falling back to josh5/steam-headless:latest"
              steam_headless_image="josh5/steam-headless:latest"
            fi
          fi

          sudo env \
            FRP_RELAY_HOST="${FRP_RELAY_HOST:-}" \
            FRP_RELAY_PORT="${FRP_RELAY_PORT:-443}" \
            FRP_TOKEN="${FRP_TOKEN:-}" \
            TAILSCALE_EXIT_NODE="${TAILSCALE_EXIT_NODE:-}" \
            bash -lc '
            set -euo pipefail

            cd /root/machine-dev

            case "'"${GAMING_STACK:-none}"'" in
              sunshine)
                env \
                  DISPLAY=:99 \
                  STEAM_USER=runner \
                  START_SUNSHINE=1 \
                  START_AUDIO=1 \
                  START_INPUT=1 \
                  START_STEAM=1 \
                  VERIFY_GPU=1 \
                  WAIT_FOR_MOONLIGHT=0 \
                  PULSE_SOCKET=/tmp/pulse-native \
                  PULSE_SERVER=unix:/tmp/pulse-native \
                  ./start-machine-dev-gaming.sh
                ;;

              wolf)
                env \
                  STOP_EXISTING_STACKS=1 \
                  PATCH_WOLF_UI=1 \
                  VERIFY_NVIDIA_DOCKER=0 \
                  ./start-machine-dev-wolf.sh
                ;;

              steam-headless)
                env \
                  STOP_EXISTING_STACKS=1 \
                  STEAM_HEADLESS_MODE=hybrid \
                  STEAM_HEADLESS_IMAGE="'"${steam_headless_image}"'" \
                  ENABLE_FRP_SUNSHINE_RELAY="$([ -n "${FRP_RELAY_HOST:-}" ] && [ -n "${FRP_TOKEN:-}" ] && printf 1 || printf 0)" \
                  FRP_RELAY_HOST="${FRP_RELAY_HOST:-}" \
                  FRP_RELAY_PORT="${FRP_RELAY_PORT:-443}" \
                  FRP_TOKEN="${FRP_TOKEN:-}" \
                  TAILSCALE_EXIT_NODE="${TAILSCALE_EXIT_NODE:-}" \
                  INSTALL_CONTAINER_BROWSER=1 \
                  INSTALL_CONTAINER_STEAM_DEPS=1 \
                  DISPLAY_SIZEW=1920 \
                  DISPLAY_SIZEH=1080 \
                  DISPLAY_REFRESH=120 \
                  ENABLE_DEBUG_VNC=0 \
                  SHOW_LOGS=1 \
                  FOLLOW_LOGS=0 \
                  ./start-machine-dev-steam-headless.sh
                ;;
            esac
          ' 2>&1 | sudo tee /tmp/machine-dev-gaming/launch.log

      - name: Print connection info
        run: |
          set -euo pipefail

          ipv4="$(tailscale ip -4 || true)"

          echo ""
          echo "SSH ready:"
          echo "  ssh runner@${ipv4}"
          echo "  ssh root@${ipv4}"
          echo ""
          echo "Or by MagicDNS:"
          echo "  ssh runner@machine-dev-l4-eu"
          echo "  ssh root@machine-dev-l4-eu"
          echo ""
          echo "Scripts:"
          echo "  cd /root/machine-dev"
          echo "  ./start-machine-dev-gaming.sh"
          echo "  ./start-machine-dev-wolf.sh"
          echo "  ./start-machine-dev-steam-headless.sh"
          echo "  # For third-party stacks, run the workflow with gaming_stack=none and install/start them manually over SSH."
          echo ""
          echo "Gaming stack logs:"
          echo "  tail -f /tmp/machine-dev-gaming/launch.log"
          echo "  tail -f /tmp/machine-dev-gaming/sunshine-stack.log"
          echo "  tail -f /tmp/machine-dev-gaming/pulseaudio.log"
          echo "  tail -f /tmp/machine-dev-gaming/input-bridge.log"
          echo "  tail -f /tmp/machine-dev-gaming/steam.log"
          echo "  docker logs -f wolf"
          echo ""

          nvidia-smi || true

      - name: Keep SSH alive
        run: |
          set -euo pipefail

          minutes='${{ github.event.inputs.keepalive_minutes }}'

          case "$minutes" in
            ''|*[!0-9]*) minutes=120 ;;
          esac

          [ "$minutes" -gt 350 ] && minutes=350

          echo "Keeping alive for ${minutes} minutes"
          echo "Canceling the workflow later is okay; Tailscale state was already snapshotted and cached."

          sleep "$((minutes * 60))"
