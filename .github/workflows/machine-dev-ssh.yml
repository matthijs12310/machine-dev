name: machine.dev SSH shell

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: "How long to keep the runner alive"
        required: true
        default: "120"
      auto_start_gaming:
        description: "Automatically start Xorg, Sunshine, audio, input bridge, and Steam"
        required: true
        default: "true"
      gaming_stack:
        description: "Which gaming stack to start: sunshine, wolf, or none"
        required: true
        default: "sunshine"

permissions:
  contents: read

jobs:
  ssh:
    runs-on:
      - machine
      - gpu=rtx6000
      - cpu=16
      - regions=eu-south-2
      - tenancy=spot
      - disk_size=100
    timeout-minutes: 360

    steps:
      - name: Checkout machine-dev
        uses: actions/checkout@v4
        with:
          path: machine-dev

      - name: Install and connect Tailscale
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq ca-certificates

          api_request() {
            local method="$1"
            local url="$2"
            local output="$3"
            shift 3

            local code
            code=$(curl -sS -X "$method" -w '%{http_code}' -o "$output" "$@" "$url")
            if [ "$code" -lt 200 ] || [ "$code" -gt 299 ]; then
              echo "Tailscale API request failed: ${method} ${url}"
              echo "HTTP status: ${code}"
              echo "Response body:"
              cat "$output"
              echo
              exit 1
            fi
          }

          if [ -n "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "Using existing TAILSCALE_AUTHKEY secret"
            authkey="${TAILSCALE_AUTHKEY}"
          else
            if [ -z "${OAUTH_CLIENT_ID:-}" ] || [ -z "${OAUTH_CLIENT_SECRET:-}" ]; then
              echo "Missing Tailscale auth. Set either TAILSCALE_AUTHKEY or both OAUTH_CLIENT_ID/OAUTH_CLIENT_SECRET."
              exit 1
            fi

            api_request POST "https://api.tailscale.com/api/v2/oauth/token" /tmp/ts-token.json \
              -d "client_id=${OAUTH_CLIENT_ID}&client_secret=${OAUTH_CLIENT_SECRET}&grant_type=client_credentials"

            token=$(jq -er '.access_token' /tmp/ts-token.json)

            api_request GET "https://api.tailscale.com/api/v2/tailnet/-/devices" /tmp/ts-devices.json \
              -H "Authorization: Bearer ${token}"

            stale_ids=$(jq -r '.devices[] | select(.hostname == "machine-dev-l4-eu") | .id' /tmp/ts-devices.json)
            if [ -z "$stale_ids" ]; then
              echo "No stale node found, continuing"
            else
              echo "$stale_ids" | while read -r id; do
                echo "Deleting stale node: $id"
                api_request DELETE "https://api.tailscale.com/api/v2/device/${id}" /tmp/ts-delete.json \
                  -H "Authorization: Bearer ${token}"
              done
              echo "Deleted, waiting for propagation"
              sleep 5
            fi

            api_request POST "https://api.tailscale.com/api/v2/tailnet/-/keys" /tmp/ts-key.json \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              -d '{
                "capabilities": {
                  "devices": {
                    "create": {
                      "reusable": false,
                      "ephemeral": true,
                      "preauthorized": true,
                      "tags": ["tag:ci"]
                    }
                  }
                }
              }'

            authkey=$(jq -er '.key' /tmp/ts-key.json)
          fi

          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled --state=/tmp/tailscaled.state >/tmp/tailscaled.log 2>&1 &
          sleep 3

          sudo tailscale up \
            --authkey="${authkey}" \
            --hostname=machine-dev-l4-eu \
            --advertise-tags=tag:ci \
            --ssh=false \
            --accept-routes

      - name: Setup SSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends openssh-server

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "${SSH_PUBLIC_KEY}" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          sudo mkdir -p /root/.ssh
          sudo chmod 700 /root/.ssh
          printf '%s\n' "${SSH_PUBLIC_KEY}" | sudo tee /root/.ssh/authorized_keys >/dev/null
          sudo chmod 600 /root/.ssh/authorized_keys

          sudo sed -i \
            -e 's/^#\?PubkeyAuthentication .*/PubkeyAuthentication yes/' \
            -e 's/^#\?PasswordAuthentication .*/PasswordAuthentication no/' \
            -e 's/^#\?PermitRootLogin .*/PermitRootLogin prohibit-password/' \
            /etc/ssh/sshd_config
          sudo mkdir -p /run/sshd
          sudo systemctl restart ssh || sudo /usr/sbin/sshd

      - name: Install scripts and restore Sunshine pairing state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEAM_SESSION_ASSET_ID: "423715286"
        run: |
          set -euo pipefail

          sudo rm -rf /root/machine-dev
          sudo mkdir -p /root/machine-dev
          sudo cp -a machine-dev/. /root/machine-dev/
          echo "Repo available at /root/machine-dev"

          sudo chmod 755 /root/machine-dev
          sudo bash -c 'chmod +x /root/machine-dev/*.sh'
          sudo bash -c 'chmod +x /root/machine-dev/*.py'

          sudo mkdir -p /root/.config/sunshine/credentials
          sudo cp /root/machine-dev/sunshine/sunshine_state.json \
            /root/.config/sunshine/sunshine_state.json
          sudo cp /root/machine-dev/sunshine/cacert.pem \
            /root/.config/sunshine/credentials/cacert.pem
          sudo cp /root/machine-dev/sunshine/cakey.pem \
            /root/.config/sunshine/credentials/cakey.pem
          sudo chmod 600 /root/.config/sunshine/credentials/cakey.pem
          echo "Sunshine pairing state restored"

          echo "Downloading Steam session release asset"
          curl -fL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/matthijs12310/machine-dev/releases/assets/${STEAM_SESSION_ASSET_ID}" \
            -o /tmp/steam-session.tar.gz
          sudo mv /tmp/steam-session.tar.gz /root/machine-dev/steam-session.tar.gz
          sudo chmod 600 /root/machine-dev/steam-session.tar.gz
          echo "Steam session archive restored to /root/machine-dev/steam-session.tar.gz"

      - name: Start gaming stack
        if: ${{ github.event.inputs.auto_start_gaming != 'false' }}
        env:
          GAMING_STACK: ${{ github.event.inputs.gaming_stack }}
        run: |
          set -euo pipefail

          sudo mkdir -p /tmp/machine-dev-gaming

          case "${GAMING_STACK:-sunshine}" in
            sunshine|wolf|none)
              ;;
            *)
              echo "Unknown gaming_stack: ${GAMING_STACK}"
              echo "Use: sunshine, wolf, or none"
              exit 1
              ;;
          esac

          if [ "${GAMING_STACK:-sunshine}" = "none" ]; then
            echo "Gaming stack autostart disabled by gaming_stack=none"
            exit 0
          fi

          echo "Starting Machine.dev ${GAMING_STACK:-sunshine} stack automatically"
          sudo bash -lc '
            set -euo pipefail
            cd /root/machine-dev
            case "'"${GAMING_STACK:-sunshine}"'" in
              sunshine)
                env \
                  DISPLAY=:99 \
                  STEAM_USER=runner \
                  START_SUNSHINE=1 \
                  START_AUDIO=1 \
                  START_INPUT=1 \
                  START_STEAM=1 \
                  VERIFY_GPU=1 \
                  WAIT_FOR_MOONLIGHT=0 \
                  PULSE_SOCKET=/tmp/pulse-native \
                  PULSE_SERVER=unix:/tmp/pulse-native \
                  ./start-machine-dev-gaming.sh
                ;;
              wolf)
                env \
                  STOP_EXISTING_STACKS=1 \
                  PATCH_WOLF_UI=1 \
                  VERIFY_NVIDIA_DOCKER=0 \
                  ./start-machine-dev-wolf.sh
                ;;
            esac
          ' 2>&1 | sudo tee /tmp/machine-dev-gaming/launch.log

      - name: Print connection info
        run: |
          set -euo pipefail
          ipv4=$(tailscale ip -4 || true)
          echo ""
          echo "SSH ready:"
          echo "  ssh runner@${ipv4}"
          echo "  ssh root@${ipv4}"
          echo ""
          echo "Or by MagicDNS:"
          echo "  ssh runner@machine-dev-l4-eu"
          echo "  ssh root@machine-dev-l4-eu"
          echo ""
          echo "Scripts:"
          echo "  cd /root/machine-dev"
          echo "  ./start-machine-dev-gaming.sh"
          echo "  ./start-machine-dev-wolf.sh"
          echo ""
          echo "Gaming stack logs:"
          echo "  tail -f /tmp/machine-dev-gaming/launch.log"
          echo "  tail -f /tmp/machine-dev-gaming/sunshine-stack.log"
          echo "  tail -f /tmp/machine-dev-gaming/pulseaudio.log"
          echo "  tail -f /tmp/machine-dev-gaming/input-bridge.log"
          echo "  tail -f /tmp/machine-dev-gaming/steam.log"
          echo "  docker logs -f wolf"
          echo ""
          nvidia-smi || true

      - name: Keep SSH alive
        run: |
          set -euo pipefail
          minutes='${{ github.event.inputs.keepalive_minutes }}'
          case "$minutes" in ''|*[!0-9]*) minutes=120 ;; esac
          [ "$minutes" -gt 350 ] && minutes=350
          echo "Keeping alive for ${minutes} minutes"
          sleep "$((minutes * 60))"
