name: Dev SSH box (test runner)

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: "How long to keep the runner alive"
        required: true
        default: "350"
      gpu_type:
        description: "Which machine.dev GPU to use"
        required: true
        type: choice
        default: "l4"
        options:
          - l4
          - a10g
      tenancy:
        description: "spot = cheap, can die mid-game. on_demand = stays up"
        required: true
        type: choice
        default: "spot"
        options:
          - spot
          - on_demand

permissions:
  contents: read

jobs:
  devbox:
    runs-on:
      - machine
      - "machine/id=${{ github.run_id }}"
      - "gpu=${{ github.event.inputs.gpu_type || 'l4' }}"
      - cpu=8
      - regions=eu-south-2
      - "tenancy=${{ github.event.inputs.tenancy || 'on_demand' }}"
      - disk_size=200
    timeout-minutes: 360

    steps:
      - name: Install basics
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openssh-server nfs-common

      - name: Tailscale up
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          curl -fsSL https://pkgs.tailscale.com/stable/tailscale_1.90.6_amd64.tgz -o /tmp/ts.tgz
          tar -xzf /tmp/ts.tgz -C /tmp
          sudo install -m 0755 /tmp/tailscale_1.90.6_amd64/tailscale /usr/local/bin/tailscale
          sudo install -m 0755 /tmp/tailscale_1.90.6_amd64/tailscaled /usr/local/bin/tailscaled
          sudo mkdir -p /var/lib/tailscale /var/run/tailscale
          sudo tailscaled --tun=autodetect \
            --statedir=/var/lib/tailscale \
            --socket=/var/run/tailscale/tailscaled.sock >/tmp/tailscaled.log 2>&1 &
          sleep 4
          sudo tailscale up \
            --authkey="${TAILSCALE_AUTHKEY}" \
            --hostname="machine-dev-test" \
            --accept-dns=false
          tailscale ip -4
          nvidia-smi | head -8
          ls /dev/dri /dev/uinput 2>&1 || true

      - name: SSH access (your key + ephemeral key for agent)
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${SSH_PUBLIC_KEY}" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo mkdir -p /root/.ssh && sudo chmod 700 /root/.ssh
          printf '%s\n' "${SSH_PUBLIC_KEY}" | sudo tee /root/.ssh/authorized_keys >/dev/null
          ssh-keygen -t ed25519 -N "" -f /tmp/devbox_key -C "devbox-${{ github.run_id }}"
          cat /tmp/devbox_key.pub >> "$HOME/.ssh/authorized_keys"
          mkdir -p /tmp/devbox-access && cp /tmp/devbox_key /tmp/devbox-access/
          chmod 600 /tmp/devbox-access/devbox_key
          sudo mkdir -p /run/sshd
          sudo sed -i -e 's/^#\?PubkeyAuthentication .*/PubkeyAuthentication yes/' \
                      -e 's/^#\?PasswordAuthentication .*/PasswordAuthentication no/' \
                      /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo /usr/sbin/sshd
          echo "TAILNET_IP=$(tailscale ip -4 | head -1)"

      - name: Upload agent access key
        uses: actions/upload-artifact@v4
        with:
          name: devbox-ssh-key
          path: /tmp/devbox-access/devbox_key
          retention-days: 1

      - name: Mount NAS library
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/nas
          sudo mount -t nfs4 100.89.163.12:/export/roms /mnt/nas
          ls /mnt/nas | head -5

      - name: Start Eden stream container
        env:
          EDEN_PASSWORD: ${{ secrets.EDEN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/eden-config
          # Custom image bakes the labwc-autostart/env fix; 99-emu-setup.sh
          # (custom-init) registers /config/roms gamedir + installs keys/fw from /nas.
          sudo docker run -d --name=eden --gpus all \
            -e PUID="$(id -u)" -e PGID="$(id -g)" -e TZ=Etc/UTC \
            -e PIXELFLUX_WAYLAND=true -e AUTO_GPU=true \
            -e SELKIES_ENCODER=nvh264enc \
            -e PASSWORD="${EDEN_PASSWORD:-changeme}" \
            -p 3000:3000 -p 3001:3001 \
            -v ~/eden-config:/config \
            -v /mnt/nas:/nas:ro \
            -v /mnt/nas:/config/roms:ro \
            --shm-size=1gb --restart unless-stopped \
            ghcr.io/matthijs12310/machine-dev/eden-machine-dev:latest
          sleep 90
          sudo docker exec eden pgrep -a -x eden | head -2 || echo "eden not up yet, check docker logs"

      - name: Print connection info
        run: |
          echo "TAILNET: $(tailscale ip -4 | head -1)"
          echo "Eden UI: https://$(tailscale ip -4 | head -1):3001 (user abc)"
          echo "SSH: ssh -i ~/.ssh/md-test/devbox_key runner@$(tailscale ip -4 | head -1)"

      - name: Keep alive
        run: |
          minutes='${{ github.event.inputs.keepalive_minutes }}'
          case "$minutes" in ''|*[!0-9]*) minutes=120 ;; esac
          [ "$minutes" -gt 350 ] && minutes=350
          echo "Alive for ${minutes} minutes. Cancel the run to stop (billing stops too)."
          sleep "$((minutes * 60))"
